services:
  inner-light:
    build: .
    ports:
      - "127.0.0.1:${DOCKER_PORT:-3001}:3000"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      MODERATION_WORDS: ${MODERATION_WORDS:-}
      MODERATION_URL: ${MODERATION_URL:-}
      MODERATION_API_KEY: ${MODERATION_API_KEY:-}
      MODERATION_MODEL: ${MODERATION_MODEL:-omni-moderation-latest}
      MODERATION_TIMEOUT_MS: ${MODERATION_TIMEOUT_MS:-5000}
      MAX_SUBMISSIONS_PER_MINUTE: ${MAX_SUBMISSIONS_PER_MINUTE:-20}
      MAX_SUBMISSIONS_PER_HOUR: ${MAX_SUBMISSIONS_PER_HOUR:-200}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - planet-data:/app/data
    restart: unless-stopped
volumes:
  planet-data:
