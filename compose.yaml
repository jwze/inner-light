services:
  inner-light:
    build: .
    ports:
      - "127.0.0.1:${DOCKER_PORT:-3001}:3000"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      MODERATION_WORDS: ${MODERATION_WORDS:-}
      MODERATION_URL: ${MODERATION_URL:-}
      MODERATION_API_KEY: ${MODERATION_API_KEY:-}
      MODERATION_MODEL: ${MODERATION_MODEL:-omni-moderation-latest}
      MAX_SUBMISSIONS_PER_MINUTE: ${MAX_SUBMISSIONS_PER_MINUTE:-20}
      MAX_SUBMISSIONS_PER_HOUR: ${MAX_SUBMISSIONS_PER_HOUR:-200}
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - planet-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  replica:
    profiles: ["replica"]
    build: .
    ports:
      - "127.0.0.1:${REPLICA_PORT:-3002}:3000"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      MODERATION_WORDS: ${MODERATION_WORDS:-}
      MODERATION_URL: ${MODERATION_URL:-}
      MODERATION_API_KEY: ${MODERATION_API_KEY:-}
      MODERATION_MODEL: ${MODERATION_MODEL:-omni-moderation-latest}
      REDIS_URL: redis://redis:6379
      MAX_SUBMISSIONS_PER_MINUTE: ${MAX_SUBMISSIONS_PER_MINUTE:-20}
      MAX_SUBMISSIONS_PER_HOUR: ${MAX_SUBMISSIONS_PER_HOUR:-200}
    volumes:
      - planet-data:/app/data
    depends_on:
      inner-light:
        condition: service_healthy
    restart: unless-stopped
volumes:
  planet-data:
  redis-data:
